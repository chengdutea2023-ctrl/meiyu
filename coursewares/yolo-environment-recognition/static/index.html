<!doctype html>
<html lang="zh-CN" data-courseware-title="环境物体识别">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>环境物体识别</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <h1>环境物体识别</h1>
    <p id="gate" role="status">正在验证课件启动信息…</p>
    <div id="lesson" hidden>
      <section class="card">
        <h2>01 · 环境识别</h2>
        <p class="muted">YOLOv8n · COCO 80 类</p>
        <div class="stage">
          <video id="video" autoplay muted playsinline hidden></video>
          <canvas id="overlay" width="640" height="360"></canvas>
          <span id="hint" class="hint">模型加载中…</span>
        </div>
        <div class="actions">
          <button id="camera" disabled>开启摄像头</button>
          <button id="run" disabled>开始实时识别</button>
          <label class="upload">上传图片识别<input id="file" type="file" accept="image/jpeg,image/png,image/webp" disabled></label>
          <button id="modelRetry" hidden>重试加载模型</button>
        </div>
        <p id="status" class="muted" role="status">正在加载本地模型…</p>
        <div class="submitbar">
          <button id="photo" disabled>拍照并加入作品栏</button>
          <span id="count">作品图片 0/3</span>
        </div>
        <div id="shots" class="shots"></div>
      </section>
      <section class="card">
        <h2>02 · 本课问卷</h2>
        <textarea id="survey" rows="5" maxlength="4000" aria-label="本课问卷" placeholder="请写下你对模型识别物体的理解和认识。"></textarea>
        <div class="actions"><button id="submit">提交作品和问卷</button><button id="returnPortal" hidden>返回学生后台</button></div>
        <p id="saveState" role="status">尚未提交</p>
      </section>
    </div>
  </main>
  <script src="./vendor/ort.wasm.min.js"></script>
  <script src="./platform-client.js"></script>
  <script src="./app.js"></script>
</body>
</html>
