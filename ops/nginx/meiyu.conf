server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _ 47.109.198.96 data.docpine.online student.docpine.online teacher.docpine.online meiyu.cdbbox.com abc.docpine.online;

    ssl_certificate /etc/letsencrypt/live/docpine-online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docpine-online/privkey.pem;
    ssl_session_cache shared:docpine_ssl:10m;
    ssl_session_timeout 10m;

    root /opt/zhimei-education-platform/app/apps/admin-web/dist;
    index index.html;

    client_max_body_size 120m;


    location ^~ /.well-known/acme-challenge/ {
        root /opt/zhimei-education-platform/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sso/ {
        proxy_pass http://127.0.0.1:3000/sso/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /register/ {
        proxy_pass http://127.0.0.1:3000/register/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /registration/ {
        proxy_pass http://127.0.0.1:3000/registration/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name agent.docpine.online;

    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    ssl_certificate /etc/letsencrypt/live/docpine-online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docpine-online/privkey.pem;
    ssl_session_cache shared:docpine_ssl:10m;
    ssl_session_timeout 10m;

    root /opt/zhimei-education-platform/courses;
    index index.html;

    client_max_body_size 120m;


    location ^~ /.well-known/acme-challenge/ {
        root /opt/zhimei-education-platform/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /showcase {
        return 301 /showcase/;
    }

    location = /showcase/ {
        rewrite ^ /showcase/index.html last;
    }

    location = /showcase/index.html {
        root /opt/zhimei-education-platform;
    }

    location ^~ /showcase/ {
        rewrite ^/showcase/(.*)$ /$1 break;
        proxy_pass https://8.137.99.19;
        proxy_http_version 1.1;
        proxy_set_header Host coursestudy.docpine.online;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_name coursestudy.docpine.online;
        proxy_ssl_verify off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_redirect https://coursestudy.docpine.online/ /showcase/;
        proxy_redirect http://coursestudy.docpine.online/ /showcase/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    location @course_runtime_app {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/__course_runtime_proxy__/([^/]+)/([^/]+)/(.*)$ {
        internal;
        proxy_pass http://127.0.0.1:3000/api/v1/course-runtime/proxy/$1/$2/$3$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/__course_runtime_proxy__/([^/]+)/([^/]+)/?$ {
        internal;
        proxy_pass http://127.0.0.1:3000/api/v1/course-runtime/proxy/$1/$2$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/([^/]+)/([^/]+)/(api|media|projector|work)/(.*)$ {
        proxy_pass http://127.0.0.1:3000/api/v1/course-runtime/proxy/$1/$2/$3/$4$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/([^/]+)/([^/]+)/(.+)$ {
        try_files /$1/coursewares/$2/static/$3 /$1/coursewares/$2/static/$3/ /$1/coursewares/$2/static/index.html @course_runtime_app;
    }

    location ~ ^/([^/]+)/([^/]+)/?$ {
        try_files /$1/coursewares/$2/static/index.html @course_runtime_app;
    }

    # 兼容旧的一层静态课件目录。
    location ~ ^/([^/]+)/(.+)$ {
        try_files /$1/static/$2 /$1/static/$2/ /$1/static/index.html =404;
    }

    location ~ ^/([^/]+)/?$ {
        try_files /$1/static/index.html =404;
    }

    location / {
        return 404;
    }
}
